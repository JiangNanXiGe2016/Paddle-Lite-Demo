plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
  //  namespace 'com.example.lib_local_ocr'
    compileSdkVersion 28

    defaultConfig {
        minSdkVersion 15
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_PLATFORM=android-23', '-DANDROID_STL=c++_shared', "-DANDROID_TOOLCHAIN="
                abiFilters 'arm64-v8a', 'armeabi-v7a'
                cppFlags "-std=c++11 -mfpu=neon"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.10.2"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'com.example' // Maven groupId
            artifactId = 'ocr' // Maven artifactId
            version = '1.0.0' // 版本号

            artifact("$buildDir/outputs/aar/${project.name}-release.aar") // 指定 AAR 文件路径
        }
    }

    repositories {
        maven {
            url = uri('../repo') // 指定本地仓库路径
        }
    }

}

